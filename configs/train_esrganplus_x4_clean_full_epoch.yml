# Clean x4 ESRGAN+ adaptation initialized from mapped RealESRGAN-x4plus weights.
name: 4x_ESRGANplus_clean_full_epoch
scale: 4
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1234

datasets:
  train:
    name: Full clean x4 corpus
    type: pairedimagedataset
    dataroot_gt:
      - datasets/mined_hr_512_text/train/text
      - datasets/mined_hr_512_photo/train/photo
      - datasets/mined_hr_512_nature/train/nature
      - datasets/mined_hr_512_anime/train/anime
      - datasets/mined_hr_512_texture/train/texture
    dataroot_lq:
      - datasets/mined_lq_x4_text/train/text
      - datasets/mined_lq_x4_photo/train/photo
      - datasets/mined_lq_x4_nature/train/nature
      - datasets/mined_lq_x4_anime/train/anime
      - datasets/mined_lq_x4_texture/train/texture
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: Full clean x4 held-out validation
    type: pairedimagedataset
    dataroot_gt:
      - datasets/mined_hr_512_text/val/text
      - datasets/mined_hr_512_photo/val/photo
      - datasets/mined_hr_512_nature/val/nature
      - datasets/mined_hr_512_anime/val/anime
      - datasets/mined_hr_512_texture/val/texture
    dataroot_lq:
      - datasets/mined_lq_x4_text/val/text
      - datasets/mined_lq_x4_photo/val/photo
      - datasets/mined_lq_x4_nature/val/nature
      - datasets/mined_lq_x4_anime/val/anime
      - datasets/mined_lq_x4_texture/val/texture

network_g:
  type: esrganplus
  num_filters: 64
  num_blocks: 23
  growth_channels: 32
  noise_mode: train
  noise_style: learned_additive
  noise_init_gain: 0.001
  noise_after_rrdb: false
  # Preserve the RRDB function at initialization; these gates remain trainable.
  rrdrb_residual_path_init_gain: 0.0

network_d:
  type: unetdiscriminatorsn
  num_feat: 64
  skip_connection: true

path:
  pretrain_network_g: experiments/pretrained_models/RealESRGAN_x4plus_to_ESRGANplus.safetensors
  pretrain_network_g_ema: experiments/pretrained_models/RealESRGAN_x4plus_to_ESRGANplus.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 1.0
  stochastic_second_pass: false
  optim_g: {type: AdamW, lr: !!float 1e-5, weight_decay: 0, betas: [0.9, 0.99]}
  optim_d: {type: AdamW, lr: !!float 5e-5, weight_decay: 0, betas: [0.9, 0.99]}
  scheduler:
    type: MultiStepLR
    milestones: [5000, 7000]
    gamma: 0.5
  total_iter: 8000
  warmup_iter: 100
  losses:
    - {type: lpipsloss, net: vgg, loss_weight: 1.0}
    - {type: l1loss, loss_weight: 0.01}
    - {type: charbonnierloss, loss_weight: 0.1, path_contains: ["/text/"]}
    - {type: averageloss, criterion: l1, scale: 8, loss_weight: 0.02}
    - type: ganloss
      gan_type: hinge
      loss_weight: 0.005
      path_contains: ["/photo/", "/nature/", "/anime/", "/texture/"]

val:
  val_enabled: true
  val_freq: 2000
  save_img: false
  tile_size: 0
  tile_overlap: 0
  stochastic_samples: 1
  stochastic_seed: 0
  metrics_enabled: true
  metrics:
    psnr: {type: calculate_psnr, crop_border: 4, test_y_channel: false}
    ssim: {type: calculate_ssim, crop_border: 4, test_y_channel: false}

logger:
  print_freq: 50
  save_checkpoint_freq: 500
  save_checkpoint_format: safetensors
  use_tb_logger: true
