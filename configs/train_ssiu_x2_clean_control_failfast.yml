# Fail-fast deterministic control for the SSIU stochastic-texture experiment.
# Keep this config aligned with train_ssiu_x2_clean_stochastic_failfast.yml.
name: 2x_SSIU_clean_control_failfast
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1234

datasets:
  train:
    name: Clean mined train
    type: pairedimagedataset
    dataroot_gt:
      - datasets/mined_hr_512_text/train/text
      - datasets/mined_hr_512_photo/train/photo
      - datasets/mined_hr_512_nature/train/nature
      - datasets/mined_hr_512_anime/train/anime
    dataroot_lq:
      - datasets/mined_lq_x2_text/train/text
      - datasets/mined_lq_x2_photo/train/photo
      - datasets/mined_lq_x2_nature/train/nature
      - datasets/mined_lq_x2_anime/train/anime
    lq_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    accum_iter: 1
  val_text:
    name: Clean text fail-fast val
    type: pairedimagedataset
    dataroot_gt: [datasets/mined_hr_512_text/val/text]
    dataroot_lq: [datasets/mined_lq_x2_text/val/text]
    max_dataset_size: 16
  val_photo:
    name: Clean photo fail-fast val
    type: pairedimagedataset
    dataroot_gt: [datasets/mined_hr_512_photo/val/photo]
    dataroot_lq: [datasets/mined_lq_x2_photo/val/photo]
    max_dataset_size: 16
  val_nature:
    name: Clean nature fail-fast val
    type: pairedimagedataset
    dataroot_gt: [datasets/mined_hr_512_nature/val/nature]
    dataroot_lq: [datasets/mined_lq_x2_nature/val/nature]
    max_dataset_size: 16
  val_anime:
    name: Clean anime fail-fast val
    type: pairedimagedataset
    dataroot_gt: [datasets/mined_hr_512_anime/val/anime]
    dataroot_lq: [datasets/mined_lq_x2_anime/val/anime]
    max_dataset_size: 16

network_g:
  type: SSIU
  colors: 3
  n_feats: 64
  n_blocks: 9
  stochastic: false

path:
  pretrain_network_g: /Users/ivannikitin/PycharmProjects/AI_watermark_worker/models/SSIU/SSIU-x2-clean70-jpeg30-perceptual.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 1.0
  stochastic_second_pass: false
  optim_g:
    type: AdamW
    lr: !!float 2e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [8000, 12000]
    gamma: 0.5
  total_iter: 15000
  warmup_iter: 500
  losses:
    - type: charbonnierloss
      loss_weight: 1.0
    - type: fftloss
      loss_weight: 0.03
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01

val:
  val_enabled: true
  val_freq: 1000
  save_img: true
  tile_size: 0
  tile_overlap: 0
  stochastic_samples: 1
  stochastic_seed: 0
  stochastic_selection: first
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  save_checkpoint_format: safetensors
  use_tb_logger: true
