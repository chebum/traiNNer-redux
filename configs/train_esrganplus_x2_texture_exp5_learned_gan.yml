# Experiment 5: corrected deep learned noise with a distributional GAN signal.
# This deliberately omits an explicit diversity floor; useful stochasticity
# must emerge from the adversarial objective rather than arbitrary difference.
name: 2x_ESRGANplus_texture_exp5_learned_gan
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1234

datasets:
  train:
    name: Clean photo and nature train
    type: pairedimagedataset
    dataroot_gt:
      - datasets/mined_hr_512_photo/train/photo
      - datasets/mined_hr_512_nature/train/nature
    dataroot_lq:
      - datasets/mined_lq_x2_photo/train/photo
      - datasets/mined_lq_x2_nature/train/nature
    lq_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    accum_iter: 1

network_g:
  type: esrganplus
  num_filters: 64
  num_blocks: 23
  growth_channels: 32
  # Follow the paper's claimed learned per-feature scaling. Noise is injected
  # after the 69 residual dense blocks only, matching its diagram and public
  # block placement rather than experiments 1-4's extra 23 RRDB injections.
  noise_mode: always
  noise_style: learned_additive
  noise_init_gain: 0.001
  noise_after_rrdb: false

network_d:
  type: unetdiscriminatorsn
  num_feat: 64
  skip_connection: true

path:
  pretrain_network_g: experiments/2x_ESRGANplus_clean_fidelity_v2/models/net_g_ema_35000.safetensors
  pretrain_network_g_ema: experiments/2x_ESRGANplus_clean_fidelity_v2/models/net_g_ema_35000.safetensors
  param_key_g: ~
  # The fidelity checkpoint lacks only the newly introduced gain parameters.
  strict_load_g: false
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 1.0
  # A diagnostic second sample tracks whether GAN training uses the gains.
  # It contributes no diversity, low-frequency, or smooth-region objective.
  stochastic_second_pass: true
  stochastic_diversity_weight: 0.0
  stochastic_low_frequency_weight: 0.0
  stochastic_smooth_region_weight: 0.0
  stochastic_detail_threshold: 0.01
  stochastic_filter_size: 15
  optim_g:
    type: AdamW
    lr: !!float 2e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [1500, 2200]
    gamma: 0.5
  total_iter: 2500
  warmup_iter: 100
  losses:
    - type: lpipsloss
      net: vgg
      loss_weight: 1.0
    - type: averageloss
      criterion: l1
      scale: 8
      loss_weight: 0.02
    - type: ganloss
      gan_type: hinge
      loss_weight: 0.005

val:
  val_enabled: false
  val_freq: 2500
  save_img: false
  stochastic_samples: 4
  stochastic_seed: 0
  metrics_enabled: false

logger:
  print_freq: 50
  save_checkpoint_freq: 250
  save_checkpoint_format: safetensors
  use_tb_logger: true
