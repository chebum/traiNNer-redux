# Twenty-thousand-step stochastic perceptual/GAN phase initialized from the
# deterministic 35k fidelity checkpoint. Clean paired data only.
name: 2x_ESRGANplus_clean_gan_20k
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1234

datasets:
  train:
    name: Clean mined train
    type: pairedimagedataset
    dataroot_gt:
      - datasets/mined_hr_512_text/train/text
      - datasets/mined_hr_512_photo/train/photo
      - datasets/mined_hr_512_nature/train/nature
      - datasets/mined_hr_512_anime/train/anime
    dataroot_lq:
      - datasets/mined_lq_x2_text/train/text
      - datasets/mined_lq_x2_photo/train/photo
      - datasets/mined_lq_x2_nature/train/nature
      - datasets/mined_lq_x2_anime/train/anime
    lq_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: Clean mined val
    type: pairedimagedataset
    dataroot_gt:
      - datasets/mined_hr_512_text/val/text
      - datasets/mined_hr_512_photo/val/photo
      - datasets/mined_hr_512_nature/val/nature
      - datasets/mined_hr_512_anime/val/anime
    dataroot_lq:
      - datasets/mined_lq_x2_text/val/text
      - datasets/mined_lq_x2_photo/val/photo
      - datasets/mined_lq_x2_nature/val/nature
      - datasets/mined_lq_x2_anime/val/anime

network_g:
  type: esrganplus
  num_filters: 64
  num_blocks: 23
  growth_channels: 32
  noise_sigma: 0.1
  noise_mode: always
  noise_after_rrdb: true

network_d:
  type: unetdiscriminatorsn
  num_feat: 64
  skip_connection: true

path:
  pretrain_network_g: experiments/2x_ESRGANplus_clean_fidelity_v2/models/net_g_ema_35000.safetensors
  pretrain_network_g_ema: experiments/2x_ESRGANplus_clean_fidelity_v2/models/net_g_ema_35000.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 10
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [10000, 16000]
    gamma: 0.5
  total_iter: 20000
  warmup_iter: 500
  losses:
    # Preserve glyph geometry only on infographic/text samples.
    - type: charbonnierloss
      loss_weight: 0.1
      path_contains: ["/text/"]
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01
    - type: ganloss
      gan_type: vanilla
      loss_weight: 0.05

val:
  val_enabled: true
  val_freq: 2500
  save_img: false
  tile_size: 0
  tile_overlap: 0
  stochastic_samples: 4
  stochastic_seed: 0
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 2500
  save_checkpoint_format: safetensors
  use_tb_logger: true
