# New degradation recipe initialized from the completed x2 restoration run.
name: 2x_ESRGANplus_calibrated_degradation_full_epoch_v2
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1234

datasets:
  train:
    name: Full calibrated degraded corpus
    type: calibrateddegradationdataset
    dataroot_gt:
      - datasets/mined_hr_512_text/train/text
      - datasets/mined_hr_512_photo/train/photo
      - datasets/mined_hr_512_nature/train/nature
      - datasets/mined_hr_512_anime/train/anime
      - datasets/mined_hr_512_texture/train/texture
    lq_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    accum_iter: 1
    degradation: &calibrated_degradation
      degradation_probability: 0.85
      pipeline_version: 2
      # No isotropic preblur. Resize still performs its normal sampling/filtering.
      motion_blur_probability: 0.20
      motion_blur_length: [0.3, 1.2]  # LR pixels; scaled to HR before filtering.
      pre_resize_jpeg_probability: 0.90
      pre_resize_jpeg_quality: [15, 65]
      resize_probabilities: {area: 0.35, bicubic: 0.45, lanczos: 0.20}
      noise_probability: 0.40
      noise_sigma: [0.0, 1.5]
      texture_smoothing_probability: 0.30
      texture_smoothing_diameter: 7
      texture_smoothing_sigma_color: [8.0, 30.0]  # On the 0-255 scale.
      texture_smoothing_sigma_space: [1.0, 2.5]  # LR pixels.
      # Independent final encode: JPEG->resize and JPEG->resize->JPEG branches.
      jpeg_probability: 0.65
      jpeg_quality: [30, 95]
      jpeg_quality_mixture:
        - {quality: [30, 55], probability: 0.35}
        - {quality: [56, 80], probability: 0.45}
        - {quality: [81, 95], probability: 0.20}
  val:
    name: Full clean held-out validation
    type: pairedimagedataset
    dataroot_gt:
      - datasets/mined_hr_512_text/val/text
      - datasets/mined_hr_512_photo/val/photo
      - datasets/mined_hr_512_nature/val/nature
      - datasets/mined_hr_512_anime/val/anime
      - datasets/mined_hr_512_texture/val/texture
    dataroot_lq:
      - datasets/mined_lq_x2_text/val/text
      - datasets/mined_lq_x2_photo/val/photo
      - datasets/mined_lq_x2_nature/val/nature
      - datasets/mined_lq_x2_anime/val/anime
      - datasets/mined_lq_x2_texture/val/texture

network_g: &generator
  type: esrganplus
  num_filters: 64
  num_blocks: 23
  growth_channels: 32
  noise_mode: train
  noise_style: learned_additive
  noise_init_gain: 0.001
  noise_after_rrdb: false

network_d:
  type: unetdiscriminatorsn
  num_feat: 64
  skip_connection: true

path:
  pretrain_network_g: experiments/2x_ESRGANplus_calibrated_degradation_full_epoch/models/net_g_ema_latest.safetensors
  pretrain_network_g_ema: experiments/2x_ESRGANplus_calibrated_degradation_full_epoch/models/net_g_ema_latest.safetensors
  pretrain_network_d: experiments/2x_ESRGANplus_calibrated_degradation_full_epoch/models/resume_models/net_d_latest.safetensors
  param_key_g: ~
  param_key_d: ~
  strict_load_g: true
  strict_load_d: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 1.0
  stochastic_second_pass: false
  optim_g: {type: AdamW, lr: !!float 2.5e-6, weight_decay: 0, betas: [0.9, 0.99]}
  optim_d: {type: AdamW, lr: !!float 1.25e-5, weight_decay: 0, betas: [0.9, 0.99]}
  scheduler:
    type: MultiStepLR
    milestones: [5000, 7000]
    gamma: 0.5
  total_iter: 8000
  warmup_iter: 0
  losses: &restoration_losses
    - {type: lpipsloss, net: vgg, loss_weight: 1.0}
    - {type: l1loss, loss_weight: 0.01}
    - {type: charbonnierloss, loss_weight: 0.1, path_contains: ["/text/"]}
    - {type: averageloss, criterion: l1, scale: 8, loss_weight: 0.02}
    - type: ganloss
      gan_type: hinge
      loss_weight: 0.005
      path_contains: ["/photo/", "/nature/", "/anime/", "/texture/"]

val: &validation
  val_enabled: true
  val_freq: 2000
  save_img: false
  tile_size: 0
  tile_overlap: 0
  stochastic_samples: 1
  stochastic_seed: 0
  metrics_enabled: true
  metrics:
    psnr: {type: calculate_psnr, crop_border: 2, test_y_channel: false}
    ssim: {type: calculate_ssim, crop_border: 2, test_y_channel: false}

logger:
  print_freq: 50
  save_checkpoint_freq: 500
  save_checkpoint_format: safetensors
  use_tb_logger: true
