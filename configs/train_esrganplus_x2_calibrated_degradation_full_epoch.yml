# One full-dataset continuation of the successful calibrated x2 pilot.
name: 2x_ESRGANplus_calibrated_degradation_full_epoch
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1234

datasets:
  train:
    name: Full calibrated degraded corpus
    type: calibrateddegradationdataset
    dataroot_gt:
      - datasets/mined_hr_512_text/train/text
      - datasets/mined_hr_512_photo/train/photo
      - datasets/mined_hr_512_nature/train/nature
      - datasets/mined_hr_512_anime/train/anime
      - datasets/mined_hr_512_texture/train/texture
    lq_size: 128
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    accum_iter: 1
    degradation: &calibrated_degradation
      degradation_probability: 0.85
      kernel_probabilities: {gaussian: 0.55, area: 0.25, kaiser: 0.15, ringing: 0.05}
      gaussian_sigma: [0.25, 1.6]
      gaussian_anisotropy: [0.75, 1.25]
      area_kernel_size: [1, 5]
      sinc_kernel_size: [7, 15]
      sinc_cutoff: [0.45, 0.85]
      kaiser_beta: [6.0, 10.0]
      ringing_kaiser_beta: [2.5, 5.0]
      noise_probability: 0.40
      noise_sigma: [0.0, 1.5]
      jpeg_probability: 0.82
      double_jpeg_probability: 0.35
      double_jpeg_quality: [45, 85]
      jpeg_quality: [75, 100]
      jpeg_quality_mixture:
        - {quality: [75, 79], probability: 0.15}
        - {quality: [90, 92], probability: 0.35}
        - {quality: [93, 95], probability: 0.37}
        - {quality: [96, 100], probability: 0.13}
  val:
    name: Full clean held-out validation
    type: pairedimagedataset
    dataroot_gt:
      - datasets/mined_hr_512_text/val/text
      - datasets/mined_hr_512_photo/val/photo
      - datasets/mined_hr_512_nature/val/nature
      - datasets/mined_hr_512_anime/val/anime
      - datasets/mined_hr_512_texture/val/texture
    dataroot_lq:
      - datasets/mined_lq_x2_text/val/text
      - datasets/mined_lq_x2_photo/val/photo
      - datasets/mined_lq_x2_nature/val/nature
      - datasets/mined_lq_x2_anime/val/anime
      - datasets/mined_lq_x2_texture/val/texture

network_g: &generator
  type: esrganplus
  num_filters: 64
  num_blocks: 23
  growth_channels: 32
  noise_mode: train
  noise_style: learned_additive
  noise_init_gain: 0.001
  noise_after_rrdb: false

network_d:
  type: unetdiscriminatorsn
  num_feat: 64
  skip_connection: true

path:
  pretrain_network_g: experiments/2x_ESRGANplus_calibrated_degradation_pilot/models/net_g_ema_2500.safetensors
  pretrain_network_g_ema: experiments/2x_ESRGANplus_calibrated_degradation_pilot/models/net_g_ema_2500.safetensors
  pretrain_network_d: experiments/2x_ESRGANplus_calibrated_degradation_pilot/models/resume_models/net_d_2500.safetensors
  param_key_g: ~
  param_key_d: ~
  strict_load_g: true
  strict_load_d: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 1.0
  stochastic_second_pass: false
  optim_g: {type: AdamW, lr: !!float 2.5e-6, weight_decay: 0, betas: [0.9, 0.99]}
  optim_d: {type: AdamW, lr: !!float 1.25e-5, weight_decay: 0, betas: [0.9, 0.99]}
  scheduler:
    type: MultiStepLR
    milestones: [5000, 7000]
    gamma: 0.5
  total_iter: 8000
  warmup_iter: 0
  losses: &restoration_losses
    - {type: lpipsloss, net: vgg, loss_weight: 1.0}
    - {type: l1loss, loss_weight: 0.01}
    - {type: charbonnierloss, loss_weight: 0.1, path_contains: ["/text/"]}
    - {type: averageloss, criterion: l1, scale: 8, loss_weight: 0.02}
    - type: ganloss
      gan_type: hinge
      loss_weight: 0.005
      path_contains: ["/photo/", "/nature/", "/anime/", "/texture/"]

val: &validation
  val_enabled: true
  val_freq: 2000
  save_img: false
  tile_size: 0
  tile_overlap: 0
  stochastic_samples: 1
  stochastic_seed: 0
  metrics_enabled: true
  metrics:
    psnr: {type: calculate_psnr, crop_border: 2, test_y_channel: false}
    ssim: {type: calculate_ssim, crop_border: 2, test_y_channel: false}

logger:
  print_freq: 50
  save_checkpoint_freq: 500
  save_checkpoint_format: safetensors
  use_tb_logger: true
